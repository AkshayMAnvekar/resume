<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshay Anvekar — AI &amp; Full-Stack Engineer</title>
  <meta name="description" content="Resume of Akshay Anvekar, AI & Full-Stack Engineer based in Bengaluru." />
  <style>
    :root {
      --accent: #3d5a80;
      --ink: #1f2933;
      --muted: #6b7280;
      --bg: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.9rem; letter-spacing: .5px; }
    header p { margin: .35rem 0 0; opacity: .9; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
      font-size: .95rem;
    }
    nav a { color: #fff; text-decoration: none; opacity: .95; border-bottom: 1px solid rgba(255,255,255,.4); }
    nav a:hover { opacity: 1; border-color: #fff; }
    .actions { text-align: center; padding: 1.25rem; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: .7rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .btn:hover { background: #34506f; }
    .viewer {
      max-width: 900px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
    }
    .viewer object, .viewer iframe {
      width: 100%;
      height: 85vh;
      border: 1px solid #d7dce1;
      border-radius: 6px;
      background: #fff;
    }
    .fallback {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Akshay Anvekar</h1>
    <p>AI &amp; Full-Stack Engineer · Bengaluru, India</p>
    <nav>
      <a href="mailto:AkshayMAnvekar@gmail.com">Email</a>
      <a href="https://github.com/AkshayMAnvekar" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/akshaymanvekar" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </header>

  <div class="actions">
    <a class="btn" href="resume.pdf" download="Akshay_Anvekar_Resume.pdf">Download PDF</a>
  </div>

  <div class="viewer">
    <object data="resume.pdf" type="application/pdf">
      <div class="fallback">
        <p>Your browser can’t display the embedded PDF.</p>
        <a class="btn" href="resume.pdf" download="Akshay_Anvekar_Resume.pdf">Download the resume instead</a>
      </div>
    </object>
  </div>

  <footer>
    Built from LaTeX and published automatically with GitHub Actions.
  </footer>
</body>
</html>
