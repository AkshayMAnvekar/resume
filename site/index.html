      --accent: #3d5a80;
      --ink: #1f2933;
      --muted: #6b7280;
      --bg: #f4f6f8;

    * { box-sizing: border-box; }
    body {
      margin: 0;

      background: var(--bg);

    }

      display: flex;
      flex-wrap: wrap;
      gap: 1rem;

      margin-top: 1rem;

    nav a {

      text-decoration: none;
      opacity: .95;

    .actions { text-align: center; padding: 1.25rem; }
    .btn {
      display: inline-block;

      padding: .7rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: background .2s, box-shadow .2s;
    }
    .btn:hover { background: #34506f; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .viewer {
      max-width: 900px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
    }
    .viewer object, .viewer iframe {
      width: 100%;
      height: 85vh;
      border: 1px solid #d7dce1;
      border-radius: 6px;
      background: #fff;
    }
    .fallback {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      padding: 1.5rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
